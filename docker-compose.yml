services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
      - ./data:/data
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-*}
    restart: unless-stopped
    # GPU support: see docker-compose.gpu.yml (requires NVIDIA Container Toolkit)
    # Start with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    # or: make up-gpu

  chat:
    build:
      context: ./chat
      dockerfile: Dockerfile
    container_name: ollama-chat
    profiles:
      - chat
    ports:
      - "${CHAT_PORT:-8080}:8080"
    depends_on:
      - ollama
    restart: unless-stopped
    environment:
      - OLLAMA_API=http://ollama:11434
    volumes:
      - ./models:/models
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock # Allow docker commands from inside container

volumes:
  ollama_data:
    driver: local
